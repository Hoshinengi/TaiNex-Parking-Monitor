[project]
name = "tainex-monitor"
version = "0.2.0"
description = "南港展覽館展覽時程與停車費率查詢"
requires-python = ">=3.12"
dependencies = [
    "flet",
    "requests",
    "beautifulsoup4",
]

[tool.flet]
org = "com.hoshinengi"
product = "TaiNEX Monitor"

[tool.flet.app]
module = "tainex_app"

[tool.flet.android]
adaptive_icon_background = "#1565C0"
source_packages = ["bs4", "soupsieve"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
